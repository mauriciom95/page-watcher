name: Check watchers

on:
  schedule:
    - cron: "3-59/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: check-watchers
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      - name: Install Playwright OS deps (cache hit case)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Run watchers
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 check.py

      - name: Commit updated state
        run: |
          if ! git diff --quiet -- state/state.json; then
            git config user.name "page-watcher-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state/state.json
            git commit -m "Update watcher state [skip ci]"
            git push
          fi
