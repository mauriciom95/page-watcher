name: TEST - playwright feasibility

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Render Fandango page and inspect content
        run: python3 scripts/playwright_probe.py
